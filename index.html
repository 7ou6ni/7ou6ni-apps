<!DOCTYPE html>
<html lang="ar" style="background:#04060c;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="المنصة الرسمية لتحميل تطبيقات 7ou6ni للأندرويد بتجربة أنيقة وسريعة.">
<title>7ou6ni Apps</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    background-color: #04060c;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .ambient-bg {
    position: fixed;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(460px circle at 12% 16%, rgba(56, 189, 248, 0.24), transparent 60%),
      radial-gradient(520px circle at 88% 22%, rgba(192, 132, 252, 0.22), transparent 62%),
      radial-gradient(480px circle at 50% 88%, rgba(34, 197, 94, 0.16), transparent 60%);
    animation: floatGlow 11s ease-in-out infinite alternate;
  }
  @keyframes floatGlow {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(0, -14px, 0) scale(1.03); }
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 12px 12px 38px 12px;
  }
  .lux-glass {
    position: relative;
    border-radius: 22px;
    backdrop-filter: blur(26px) saturate(165%);
    -webkit-backdrop-filter: blur(26px) saturate(165%);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  .badge-official {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.24);
    letter-spacing: 0.5px;
  }
  .brand-sub {
    font-size: 11px;
    margin-top: 2px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .glass-btn {
    border: 1px solid rgba(255, 255, 255, 0.18);
    cursor: pointer;
    font-weight: 700;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .glass-btn:active {
    transform: scale(0.95);
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 11px;
    font-size: 13.5px;
    display: grid;
    place-items: center;
  }
  .lang-btn {
    padding: 7px 11px;
    border-radius: 11px;
    font-size: 11px;
    background: linear-gradient(135deg, rgba(255,255,255,0.24), rgba(255,255,255,0.08));
  }
  .hero {
    padding: 13px 14px;
    text-align: center;
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: 14.5px;
    font-weight: 800;
    margin-bottom: 3px;
  }
  .hero-desc {
    margin: 0;
    font-size: 11.5px;
    line-height: 1.5;
  }
  .app-card {
    padding: 12px 13px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .app-head {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 8px;
  }
  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }
  .app-meta {
    flex: 1;
    min-width: 0;
  }
  .app-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }
  .app-title {
    font-size: 13.5px;
    font-weight: 800;
  }
  .app-tag {
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .app-desc {
    font-size: 11.5px;
    line-height: 1.45;
    margin-top: 3px;
  }
  .features-box {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .feat-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.10);
  }
  .dl-glass-btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    padding: 8.5px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  .timer-box {
    margin-top: 8px;
    padding: 9px 11px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .timer-badge {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    background: rgba(56, 189, 248, 0.18);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.35);
    flex-shrink: 0;
  }
  .guide {
    padding: 12px 14px;
    margin-top: 10px;
  }
  .guide-title {
    font-size: 12.5px;
    font-weight: 800;
    margin-bottom: 5px;
    display: block;
  }
  .guide-body {
    font-size: 11.5px;
    line-height: 1.65;
  }
  .footer {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    line-height: 1.7;
  }
</style>
</head>
<body id="bodyEl" dir="rtl">

<div class="ambient-bg"></div>

<div class="container">
  <header id="hdrEl" class="topbar lux-glass">
    <div>
      <div class="brand-row">
        <span id="titleEl" class="brand-name">7OU6NI APPS</span>
        <span id="badgeEl" class="badge-official">OFFICIAL</span>
      </div>
      <div id="subEl" class="brand-sub">المنصة الرسمية لتحميل تطبيقات الأندرويد</div>
    </div>
    <div class="actions">
      <button id="themeBtn" class="glass-btn icon-btn" onclick="toggleTheme()" aria-label="Theme">☀️</button>
      <button id="langBtn" class="glass-btn lang-btn" onclick="toggleLang()">EN 🌐</button>
    </div>
  </header>

  <section id="heroEl" class="hero lux-glass">
    <div id="heroTitleEl" class="hero-title">حمّل تطبيقاتنا مباشرة على هاتفك</div>
    <p id="heroDescEl" class="hero-desc">تطبيقات مختارة بعناية بصيغة APK مباشرة أو عبر المتجر الرسمي.</p>
  </section>

  <main id="appsContainer"></main>

  <section id="guideEl" class="guide lux-glass">
    <b id="guideTitleEl" class="guide-title">📲 طريقة التثبيت على أندرويد:</b>
    <div id="guideBodyEl" class="guide-body"></div>
  </section>

  <footer id="footerEl" class="footer">
    <span id="devLine">تطوير: 🧑‍💻 <b>7ou6ni</b></span> • <span id="contactLabel">للتواصل:</span> <span dir="ltr">7ou6ni@bk.ru</span>
  </footer>
</div>

<script>
var isEn = false;
var isLight = false;
var countdownTimer = null;

var APPS = [
  {
    id: "sensi",
    img: "app_icon_512x512-1.png",
    accent: "#38bdf8",
    nameAr: "Pro Sensi DPI",
    nameEn: "Pro Sensi DPI",
    descAr: "حاسبة الحساسية وإعدادات الـ DPI ونصائح الهيدشوت لأكثر من 100 هاتف.",
    descEn: "Sensitivity & DPI calculator with headshot tips for 100+ devices.",
    featuresAr: ["⚡ قيم DPI دقيقة", "🎯 نصائح هيدشوت", "📱 +100 نوع هاتف"],
    featuresEn: ["⚡ Accurate DPI values", "🎯 Headshot tips", "📱 100+ phones"],
    tagAr: "V3.0 • APK",
    tagEn: "V3.0 • APK",
    link: "https://srnky.com/FKaWGctqMD",
    waitSeconds: 10
  },
  {
    id: "news",
    img: "2463348_ico (1).png",
    accent: "#22c55e",
    nameAr: "أخبار العرب والعالم - عاجل",
    nameEn: "Arab & World News - Breaking",
    descAr: "متابعة مستمرة وسريعة لأهم الأخبار العربية والعالمية العاجلة لحظة بلحظة.",
    descEn: "Fast and organized breaking Arab and world news updates.",
    featuresAr: ["📰 عاجل لحظة بلحظة", "🌍 أخبار عربية وعالمية", "⚡ تصفح سريع وخفيف"],
    featuresEn: ["📰 Live breaking news", "🌍 Arab & world coverage", "⚡ Fast & lightweight"],
    tagAr: "Google Play",
    tagEn: "Google Play",
    link: "https://play.google.com/store/apps/details?id=com.news.maroc.nabd.app",
    waitSeconds: 0
  },
  {
    id: "spanish",
    img: "1795378783081.jpg",
    accent: "#c084fc",
    nameAr: "تعلم اللغة الإسبانية",
    nameEn: "Learn Spanish",
    descAr: "تعلّم أساسيات اللغة الإسبانية والعبارات اليومية بأسلوب بسيط ومباشر.",
    descEn: "Learn Spanish essentials and everyday phrases simply.",
    featuresAr: ["🗣️ عبارات يومية", "📚 أساسيات مبسطة", "✨ مناسب للمبتدئين"],
    featuresEn: ["🗣️ Daily phrases", "📚 Core basics", "✨ Beginner friendly"],
    tagAr: "V1.0 • APK",
    tagEn: "V1.0 • APK",
    link: "https://www.mediafire.com/file/sbc8x33dewsnog4/%25D8%25AA%25D8%25B9%25D9%2584%25D9%2585_%25D8%25A7%25D9%2584%25D9%2584%25D8%25BA%25D8%25A9_%25D8%25A7%25D9%2584%25D8%25A5%25D8%25B3%25D8%25A8%25D8%25A7%25D9%2586%25D9%258A%25D8%25A9.apk/file",
    waitSeconds: 0
  }
];

function startTimedRedirect(appId, url, seconds) {
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  var allBoxes = document.querySelectorAll(".timer-box");
  for (var k = 0; k < allBoxes.length; k++) {
    allBoxes[k].style.display = "none";
  }

  var box = document.getElementById("timer-" + appId);
  var textEl = document.getElementById("timer-text-" + appId);
  var badgeEl = document.getElementById("timer-badge-" + appId);
  if (!box || !textEl || !badgeEl) return;

  var left = seconds;
  box.style.display = "flex";
  textEl.textContent = isEn ? "Preparing your download link..." : "جاري تجهيز رابط التحميل...";
  badgeEl.textContent = left + "s";

  countdownTimer = setInterval(function() {
    left--;
    if (left > 0) {
      badgeEl.textContent = left + "s";
    } else {
      clearInterval(countdownTimer);
      countdownTimer = null;
      badgeEl.textContent = "0s";
      textEl.innerHTML = isEn
        ? 'Ready! <a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;text-decoration:underline;">Open Link</a>'
        : 'جاهز! <a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;text-decoration:underline;">افتح الرابط</a>';
      window.open(url, "_blank", "noopener,noreferrer");
    }
  }, 1000);
}

function toggleTheme() {
  isLight = !isLight;
  renderPage();
}

function toggleLang() {
  isEn = !isEn;
  renderPage();
}

function renderPage() {
  var pageBg = isLight ? "#e8eef5" : "#04060c";
  var glassSurface = isLight
    ? "linear-gradient(145deg, rgba(255,255,255,0.78), rgba(255,255,255,0.48))"
    : "linear-gradient(145deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03))";
  var pillBg = isLight ? "rgba(15, 23, 42, 0.05)" : "rgba(255, 255, 255, 0.05)";
  var timerBg = isLight ? "rgba(255, 255, 255, 0.65)" : "rgba(4, 6, 12, 0.48)";
  var borderCol = isLight ? "rgba(15, 23, 42, 0.12)" : "rgba(255, 255, 255, 0.14)";
  var textCol = isLight ? "#0f172a" : "#f8fafc";
  var mutedCol = isLight ? "#475569" : "#94a3b8";

  document.documentElement.style.backgroundColor = pageBg;
  var body = document.getElementById("bodyEl");
  body.style.backgroundColor = pageBg;
  body.style.color = textCol;
  body.dir = isEn ? "ltr" : "rtl";

  var hdr = document.getElementById("hdrEl");
  hdr.style.background = glassSurface;
  hdr.style.borderColor = borderCol;

  document.getElementById("titleEl").style.color = textCol;
  document.getElementById("badgeEl").style.color = isLight ? "#0369a1" : "#e0f2fe";
  document.getElementById("subEl").style.color = mutedCol;
  document.getElementById("subEl").textContent = isEn
    ? "Official Android Apps Hub"
    : "المنصة الرسمية لتحميل تطبيقات الأندرويد";

  var tBtn = document.getElementById("themeBtn");
  tBtn.textContent = isLight ? "🌙" : "☀️";
  tBtn.style.background = isLight ? "rgba(255,255,255,0.65)" : "rgba(255,255,255,0.08)";
  tBtn.style.color = isLight ? "#0f172a" : "#fde047";
  tBtn.style.borderColor = borderCol;

  var lBtn = document.getElementById("langBtn");
  lBtn.textContent = isEn ? "AR 🌐" : "EN 🌐";
  lBtn.style.color = textCol;
  lBtn.style.borderColor = borderCol;

  var hero = document.getElementById("heroEl");
  hero.style.background = glassSurface;
  hero.style.borderColor = borderCol;

  var hTitle = document.getElementById("heroTitleEl");
  hTitle.style.color = isLight ? "#0284c7" : "#7dd3fc";
  hTitle.textContent = isEn ? "Download Our Apps Directly" : "حمّل تطبيقاتنا مباشرة على هاتفك";

  var hDesc = document.getElementById("heroDescEl");
  hDesc.style.color = mutedCol;
  hDesc.textContent = isEn
    ? "Pick an app below and tap download to get started."
    : "تطبيقات مختارة بعناية بصيغة APK مباشرة أو عبر المتجر الرسمي.";

  var cardsHtml = "";
  for (var i = 0; i < APPS.length; i++) {
    var a = APPS[i];
    var name = isEn ? a.nameEn : a.nameAr;
    var desc = isEn ? a.descEn : a.descAr;
    var tag = isEn ? a.tagEn : a.tagAr;
    var feats = isEn ? a.featuresEn : a.featuresAr;
    var btnLabel = isEn ? "Download ⬇️" : "تحميل التطبيق ⬇️";
    var btnBg = isLight
      ? "linear-gradient(135deg, " + a.accent + "d9, " + a.accent + "99)"
      : "linear-gradient(135deg, " + a.accent + "45, " + a.accent + "1f)";
    var btnText = isLight ? "#041019" : "#ffffff";

    var featsHtml = '<div class="features-box">';
    for (var f = 0; f < feats.length; f++) {
      featsHtml += '<span class="feat-pill" style="background:' + pillBg + ';color:' + textCol + ';">' + feats[f] + '</span>';
    }
    featsHtml += '</div>';

    var btnActionHtml = a.waitSeconds > 0
      ? '<button type="button" class="dl-glass-btn" onclick="startTimedRedirect(\'' + a.id + '\', \'' + a.link + '\', ' + a.waitSeconds + ')" style="background:' + btnBg + ';color:' + btnText + ';border:1px solid ' + a.accent + '88;cursor:pointer;">' + btnLabel + '</button>' +
        '<div id="timer-' + a.id + '" class="timer-box" style="background:' + timerBg + ';color:' + textCol + ';">' +
          '<span id="timer-text-' + a.id + '"></span>' +
          '<span id="timer-badge-' + a.id + '" class="timer-badge">10s</span>' +
        '</div>'
      : '<a class="dl-glass-btn" href="' + a.link + '" target="_blank" rel="noopener noreferrer" style="background:' + btnBg + ';color:' + btnText + ';border:1px solid ' + a.accent + '88;">' + btnLabel + '</a>';

    cardsHtml +=
      '<article class="app-card lux-glass" style="background:' + glassSurface + ';border-color:' + borderCol + ';">' +
        '<div class="app-head">' +
          '<img class="app-icon" src="' + a.img + '" alt="' + name + '" style="border:1px solid ' + a.accent + '88;background:' + a.accent + '20;">' +
          '<div class="app-meta">' +
            '<div class="app-title-row">' +
              '<span class="app-title" style="color:' + textCol + ';">' + name + '</span>' +
              '<span class="app-tag" style="background:rgba(255,255,255,0.06);color:' + a.accent + ';border-color:' + a.accent + '55;">' + tag + '</span>' +
            '</div>' +
            '<div class="app-desc" style="color:' + mutedCol + ';">' + desc + '</div>' +
          '</div>' +
        '</div>' +
        featsHtml +
        btnActionHtml +
      '</article>';
  }
  document.getElementById("appsContainer").innerHTML = cardsHtml;

  var guide = document.getElementById("guideEl");
  guide.style.background = glassSurface;
  guide.style.borderColor = borderCol;

  var gTitle = document.getElementById("guideTitleEl");
  gTitle.style.color = isLight ? "#b45309" : "#fde047";
  gTitle.textContent = isEn ? "📲 How to Install on Android:" : "📲 طريقة التثبيت على أندرويد:";

  var gBody = document.getElementById("guideBodyEl");
  gBody.style.color = textCol;
  gBody.innerHTML = isEn
    ? "1. Tap <b>Download</b> on the app card.<br>2. Open the <b>APK</b> file from notifications or Files.<br>3. Allow <b>Install from this source</b> if prompted, then tap <b>Install</b>."
    : "1. اضغط على زر <b>تحميل التطبيق</b> في البطاقة المطلوبة.<br>2. افتح ملف <b>APK</b> بعد التنزيل من الإشعارات أو مدير الملفات.<br>3. إذا طُلب منك، فعّل <b>السماح من هذا المصدر</b> ثم اضغط <b>تثبيت</b>.";

  document.getElementById("devLine").innerHTML = isEn
    ? 'Developer: 🧑‍💻 <b style="color:#38bdf8;">7ou6ni</b>'
    : 'تطوير: 🧑‍💻 <b style="color:#38bdf8;">7ou6ni</b>';
  document.getElementById("contactLabel").textContent = isEn ? "Contact:" : "للتواصل:";
  document.getElementById("footerEl").style.color = mutedCol;
}

renderPage();
</script>
</body>
</html>
